# v2 (apps/ranker-container): identical to v1 except the feature-cache container
# has been REMOVED. After Argo CD syncs this with ServerSideApply=true, the pod
# should have exactly two containers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker
  labels:
    app: ranker
spec:
  selector:
    matchLabels:
      app: ranker
  template:
    metadata:
      labels:
        app: ranker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: retriever
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
        - name: ranker
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
