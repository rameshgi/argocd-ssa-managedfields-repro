# v2: identical to v1 except retriever's CPU limit has been REMOVED (a common
# cleanup: "don't set CPU limits"). After Argo CD syncs this with
# ServerSideApply=true, retriever should have no CPU limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker
  labels:
    app: ranker
spec:
  selector:
    matchLabels:
      app: ranker
  template:
    metadata:
      labels:
        app: ranker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: retriever
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        - name: ranker
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
