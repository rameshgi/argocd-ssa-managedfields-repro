# v1: a multi-container "retrieval + ranking" Deployment, created and managed
# by Argo CD with server-side apply. retriever has a CPU limit of 500m.
#
# NOTE: `replicas` is intentionally omitted so that `kubectl scale` (one of the
# day-2 field managers) does not fight with Argo CD over spec.replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker
  labels:
    app: ranker
spec:
  selector:
    matchLabels:
      app: ranker
  template:
    metadata:
      labels:
        app: ranker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: retriever
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
        - name: ranker
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
