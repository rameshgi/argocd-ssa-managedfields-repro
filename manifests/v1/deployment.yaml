# v1: a multi-container "retrieval + ranking" pod (the shape described in the
# LinkedIn post). The `feature-cache` container is the one that will be
# removed from Git in v2.
#
# NOTE: `replicas` is intentionally omitted so that `kubectl scale` (one of the
# field managers we add) does not fight with Argo CD over spec.replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker
  labels:
    app: ranker
spec:
  selector:
    matchLabels:
      app: ranker
  template:
    metadata:
      labels:
        app: ranker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: retriever
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
        - name: ranker
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
        - name: feature-cache
          image: registry.k8s.io/pause:3.10
          env:
            - name: CACHE_MODE
              value: legacy
          resources:
            requests: {cpu: 5m, memory: 8Mi}
